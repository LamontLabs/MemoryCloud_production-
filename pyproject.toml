[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memorycloud"
version = "4.3.0"
description = "MemoryCloud — Privacy-First AI Memory Assistant (demo backend)"
authors = [{ name = "Jesse J. Lamont", email = "lamontlabs@proton.me" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.2",
  "uvicorn[standard]==0.30.6",
  "pydantic==2.9.2",
  "python-dotenv==1.0.1",
  "PyNaCl==1.5.0",
  "cryptography==43.0.1",
  "aiosqlite==0.20.0",
  "reportlab==4.2.2"
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.flake8]
max-line-length = 100
exclude = [".venv", "dist", "node_modules", "build"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
exclude = ["build", "dist", ".venv", "node_modules"]

[tool.isort]
profile = "black"

[project.urls]
Homepage = "https://github.com/Lamont-Labs/MemoryCloud"
