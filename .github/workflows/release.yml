name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release bundle
        run: |
          mkdir -p dist
          zip -r dist/MemoryCloud_release_${{ github.ref_name }}.zip . -x "*.venv*" -x "node_modules/*"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MemoryCloud_release
          path: dist/MemoryCloud_release_${{ github.ref_name }}.zip
